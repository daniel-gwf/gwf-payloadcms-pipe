name: Payload CMS Multi-Stage CI/CD

on:
  push:
    branches:
      - develop  # Starts the pipeline for Manual Test/Dev
      - main     # Starts a deployment for Production (after merge from UAT)
  workflow_dispatch:
    # Allows manually starting the workflow, useful for re-runs

env:
  NODE_VERSION: '18'

jobs:
  # ==========================================================
  # 1. CI / MANUAL TEST STAGE (DEVELOP BRANCH)
  # ==========================================================
  ci_and_manual_test:
    name: 🧪 CI & Manual Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' # Only runs for pushes to 'develop' branch
    outputs:
      release_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        # 🎯 ADD THE COMMAND HERE TO INSTALL PNPM GLOBALLY
        run: |
            npm install -g pnpm
            npm ci

      - name: Run Payload Tests & Linting
        # You must have 'test' and 'lint' scripts defined in package.json
        run: |
         # npm run test
          npm run lint

      - name: Generate Short SHA as Release Version
        # This creates a unique ID for the release
        id: version
        run: echo "version=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy to Dev/Manual Test (Render Auto-Deploy)
        # Assuming your 'payload-dev' service uses Render's built-in auto-deploy
        # based on pushes to the 'develop' branch.
        run: echo "CI successful. The code is auto-deployed to the Dev/Manual Test environment on Render."
        # No Deploy Hook is needed here if Render is configured for auto-deploy on 'develop'

  # ==========================================================
  # 2. UAT DEPLOYMENT STAGE (Requires Manual Approval on GitHub)
  # ==========================================================
  deploy_to_uat:
    name: 🌐 Deploy to UAT
    needs: ci_and_manual_test # Must pass CI first
    runs-on: ubuntu-latest
    environment:
      name: UAT # Uses the UAT GitHub Environment, enabling manual approval
    if: success() && github.ref == 'refs/heads/develop' # Only runs if CI passed AND branch is develop

    steps:
      - name: Trigger Render UAT Deploy
        # Hits the Deploy Hook to pull the latest 'develop' code, build, migrate, and start
        run: |
          echo "Deploying Release ${{ needs.ci_and_manual_test.outputs.release_version }} to UAT..."
          curl -X POST ${{ secrets.RENDER_UAT_HOOK }}
          echo "UAT deployment triggered. Release Version: ${{ needs.ci_and_manual_test.outputs.release_version }}"
          echo "Manual testing can now begin on the UAT environment."

      - name: Merge to UAT Branch (If UAT Passes)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'RELEASE: Promote ${{ needs.ci_and_manual_test.outputs.release_version }} from develop to uat'
          title: 'Release ${{ needs.ci_and_manual_test.outputs.release_version }} ready for UAT sign-off'
          body: |
            This PR contains the code for Release **${{ needs.ci_and_manual_test.outputs.release_version }}**, which passed all CI and Manual Testing on the Dev environment.

            **Please sign off after successful UAT is complete.**
          branch: ci/release-${{ needs.ci_and_manual_test.outputs.release_version }}
          base: uat

  # ==========================================================
  # 3. PRODUCTION DEPLOYMENT STAGE (Triggered by Merge to 'main')
  # ==========================================================
  deploy_to_production:
    name: 🚀 Deploy to Production
    # This job is triggered by a merge to 'main'
    runs-on: ubuntu-latest
    environment:
      name: Production # Uses the Production GitHub Environment, enabling manual approval
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Production Deploy
        # Hits the Deploy Hook to pull the latest 'main' code, build, migrate, and start
        run: |
          echo "Deploying to Production..."
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}
          echo "Production deployment triggered."

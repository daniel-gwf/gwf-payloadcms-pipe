# .github/workflows/deploy.yml
name: Reusable Deploy Workflow (Tag-based)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: true
        type: string
      tag:
        required: true
        type: string
      # 💥 CRITICAL FIX: Add the missing input
      artifact-name:
        required: false # Set to true if deployment MUST use an artifact
        type: string
        default: '' # Provide a default if it's not strictly required
    secrets:
      PAYLOAD_SECRET:
        required: false
      render_hook:
        required: true # The hook is mandatory for deployment
      NPM_TOKEN:
        required: false
      DATABASE_URI:
        required: false

jobs:
  deploy:
    name: "Deploy for ${{ inputs.stage }}"
    runs-on: ubuntu-latest
    # CRITICAL: Uses the environment name for GitHub protection rules (required reviewers)
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read
    env:
      NODE_ENV: production
      DEPLOY_TAG: ${{ inputs.tag }} # The clean tag name (e.g., v1.0.0)
      RENDER_HOOK: ${{ secrets.render_hook }}
      SECRET_KEY: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

    steps:
      - name: Checkout Code (The exact tagged commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      # 💥 CRITICAL FIX: Add the step to download the built artifact
      - name: Download Artifact from Build
        if: ${{ inputs.artifact-name != '' }} # Only run if an artifact name was provided
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: . # Downloads contents into the root of the runner workspace

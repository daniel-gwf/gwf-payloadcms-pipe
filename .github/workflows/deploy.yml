# .github/workflows/deploy.yml
name: Reusable Deploy Workflow (Tag-based)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: true
        type: string
      tag:
        required: true
        type: string
      # 💥 CRITICAL FIX: Add the missing input
      artifact-name:
        required: false # Set to true if deployment MUST use an artifact
        type: string
        default: '' # Provide a default if it's not strictly required
    secrets:
      PAYLOAD_SECRET:
        required: false
      render_hook:
        required: true # The hook is mandatory for deployment
      NPM_TOKEN:
        required: false
      DATABASE_URI:
        required: false

jobs:
  deploy:
    name: "Deploy for ${{ inputs.stage }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: write # 👈 CRITICAL: MUST be 'write' for pushing to a branch
    env:
      NODE_ENV: production
      DEPLOY_TAG: ${{ inputs.tag }} # The clean tag name (e.g., v1.0.0)
      RENDER_HOOK: ${{ secrets.render_hook }}
      SECRET_KEY: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

    steps:
      - name: Checkout Code (The exact tagged commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checkout the specific tag commit
          ref: refs/tags/${{ inputs.tag }}

      - name: 🚀 Force Push Tag Commit to Render Deployment Branch
        if: ${{ inputs.stage == 'uat' || inputs.stage == 'production' }} # Only run for UAT/Prod deployments
        run: |
          # 1. Configure Git identity
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"

          # 2. Determine the target branch based on the stage
          TARGET_BRANCH="render-deploy-${{ inputs.stage }}"

          # 3. Create a temporary branch at the tag's commit and force push it
          # -f (force) is needed to overwrite the branch's history with the single tag commit.
          # We use the GITHUB_TOKEN for authentication.
          echo "Force pushing tag ${{ inputs.tag }} to branch $TARGET_BRANCH"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }} \
            origin HEAD:$TARGET_BRANCH

      - name: Trigger Render Deploy Hook
        # The hook is now just a signal to Render that its watch branch (render-deploy-uat) is updated
        if: ${{ env.RENDER_HOOK != '' }}
        run: |
          echo "Triggering Render for stage=${{ inputs.stage }}..."
          curl -X POST -sSf "${{ env.RENDER_HOOK }}" \
            -w "\nHTTP Status: %{http_code}\n"

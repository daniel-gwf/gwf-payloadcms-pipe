name: Reusable Deploy Workflow (tag-triggered)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: false
        type: string
      tag:
        required: false
        type: string

jobs:
  deploy:
    name: "Deploy for ${{ inputs.stage }} (tag: ${{ inputs.tag || github.ref_name }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read

    env:
      NODE_ENV: production
      DEPLOY_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint || true

      - name: Run build
        run: npm run build

      - name: Package build output
        run: |
          mkdir -p build-output
          zip -r build-output/build-${{ inputs.stage }}-${{ github.sha }}.zip build dist || true

      - name: Trigger Render (UAT/Production only)
        if: ${{ inputs.stage != 'code-review' && env.RENDER_HOOK != '' }}
        run: |
          echo "Triggering Render for stage=${{ inputs.stage }} (tag=${{ env.DEPLOY_TAG }})"
          curl -X POST -sSf -H "Content-Type: application/json" "${{ env.RENDER_HOOK }}" -d '{}'

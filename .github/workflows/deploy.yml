# .github/workflows/deploy.yml
name: Reusable Deploy Workflow (Tag-based)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: true # Environment is required for gating
        type: string
      tag:
        required: true # Tag is REQUIRED for this flow
        type: string
    secrets:
      PAYLOAD_SECRET:
        required: false
      render_hook:
        required: true # The hook is mandatory for deployment
      NPM_TOKEN:
        required: false
      DATABASE_URI:
        required: false

jobs:
  deploy:
    name: "Deploy for ${{ inputs.stage }}"
    runs-on: ubuntu-latest
    # CRITICAL: Uses the environment name for GitHub protection rules (required reviewers)
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read
    env:
      NODE_ENV: production
      DEPLOY_TAG: ${{ inputs.tag }} # The clean tag name (e.g., v1.0.0)
      RENDER_HOOK: ${{ secrets.render_hook }}
      SECRET_KEY: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

    steps:
      - name: Checkout Code (The exact tagged commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # CRITICAL: Checkout the specific tag
          ref: refs/tags/${{ inputs.tag }}

      - name: Trigger Render Deploy Hook
        if: ${{ env.RENDER_HOOK != '' }}
        run: |
          echo "Triggering Render for stage=${{ inputs.stage }} from tag=${{ inputs.tag }}..."
          # The curl command can optionally send the tag/commit info to Render if your setup expects it
          curl -X POST -sSf "${{ env.RENDER_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{ \"tag\": \"${{ inputs.tag }}\", \"commit_sha\": \"${{ github.sha }}\" }" \
            -w "\nHTTP %{http_code}\n"
          echo "${{ inputs.stage }} deployment successfully triggered in Render."

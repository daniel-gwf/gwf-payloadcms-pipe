# .github/workflows/deploy.yml
name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: false
        type: string
      tag:
        required: false
        type: string
    secrets:
      PAYLOAD_SECRET:
        required: false
      render_hook:
        required: false
      NPM_TOKEN:
        required: false
      # 🔑 FIX: Accept DATABASE_URI as an input secret
      DATABASE_URI:
        required: false

jobs:
  deploy:
    name: "Deploy for ${{ inputs.stage }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read

    env:
      NODE_ENV: production
      DEPLOY_TAG: ${{ inputs.tag || github.ref_name }}
      RENDER_HOOK: ${{ secrets.render_hook }}
      SECRET_KEY: ${{ secrets.PAYLOAD_SECRET }}
      # 🔑 FIX: Expose DATABASE_URI as an environment variable
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      # The CI_BUILD flag is commented out/removed to force a database connection

    steps:
      - name: Checkout Code (Needed for Render deploy hook)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}


      # Trigger Render Deploy Hook...
      - name: Trigger Render Deploy Hook
        if: ${{ inputs.stage != 'code-review' && env.RENDER_HOOK != '' }}
        run: |
          echo "Triggering Render for stage=${{ inputs.stage }}..."
          curl -X POST -sSf -H "Content-Type: application/json" "${{ env.RENDER_HOOK }}" -d '{}'

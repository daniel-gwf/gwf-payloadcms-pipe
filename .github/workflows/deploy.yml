# .github/workflows/deploy.yml
name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: false
        type: string
      tag:
        required: false
        type: string
    secrets:
      PAYLOAD_SECRET:
        required: false
      render_hook:
        required: false
      NPM_TOKEN:
        required: false
      # 💡 FIX 1: Add DATABASE_URL to the list of accepted secrets
      DATABASE_URI:
        required: false

jobs:
  deploy:
    name: "Deploy for ${{ inputs.stage }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read
    env:
      NODE_ENV: production
      DEPLOY_TAG: ${{ inputs.tag || github.ref_name }}
      RENDER_HOOK: ${{ secrets.render_hook }}
      # Retaining SECRET_KEY name based on your file's history
      SECRET_KEY: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      # 💡 FIX: Add flag to skip DB connection
      # CI_BUILD: 'true'

      # ... (rest of your build steps)
    steps:
      - name: Checkout Code (Needed for Render deploy hook)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # 💡 FIX 1: Removed redundant Setup Node.js, npm ci, npm run build steps.
      # The app is built in the ci-build job.

      - name: Trigger Render Deploy Hook
        if: ${{ inputs.stage != 'code-review' && env.RENDER_HOOK != '' }}
        run: |
          echo "Triggering Render for stage=${{ inputs.stage }}..."
          # Render will check out the latest commit on the associated branch (e.g., 'develop')
          # and then rebuild the service using its internal CI process.
          curl -X POST -sSf -H "Content-Type: application/json" "${{ env.RENDER_HOOK }}" -d '{}'

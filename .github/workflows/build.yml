# .github/workflows/build.yml
name: Build Workflow (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: false
        type: string
    secrets:
      repo_token:
        required: true
      NPM_TOKEN:
        required: false
      render_hook:
        required: false
      PAYLOAD_SECRET:
        required: false
      DATABASE_URL:
        required: false

jobs:
  build:
    name: Build for ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read

    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.artifact }}

    env:
      RENDER_HOOK: ${{ secrets.render_hook }}
      # Retaining old name for consistency if used elsewhere:
      NPM_TOKEN_ENV: ${{ secrets.NPM_TOKEN }}
      # 💡 FIX: Map the incoming secret to the exact name Payload expects during build.
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # 💡 FIX: Expose the DB URL
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 💡 FIX: Explicitly set a flag for the CI build environment
      CI_BUILD: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Authenticate npm (optional)
        run: |
          if [ -n "${NPM_TOKEN_ENV}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_ENV}" > ~/.npmrc
          else
            echo "No NPM_TOKEN provided — skipping npm authentication"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run build
        # The build command now has SECRET_KEY available in its environment
        run: npm run build

      - name: Package build output
        run: |
          mkdir -p build-output
          zip -r build-output/build-${{ inputs.stage }}.zip build dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.stage }}
          path: build-output/
          retention-days: 7

      - id: set-artifact
        run: echo "artifact=build-${{ inputs.stage }}" >> $GITHUB_OUTPUT

      - name: Trigger Render (UAT/Production only)
        if: ${{ inputs.stage != 'code-review' && env.RENDER_HOOK != '' }}
        run: |
          echo "Triggering Render for stage=${{ inputs.stage }}"
          curl -X POST -sSf -H "Content-Type: application/json" "${{ env.RENDER_HOOK }}" -d '{}'

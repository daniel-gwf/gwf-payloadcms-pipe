# .github/workflows/build.yml
name: Build Workflow (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: false
        type: string
    secrets:
      # 🚫 FIX: Removed 'repo_token' since it's not used in this workflow and was removed from the caller
      NPM_TOKEN:
        required: false
      render_hook:
        required: false
      PAYLOAD_SECRET:
        required: false
      DATABASE_URI:
        required: false

jobs:
  build:
    name: Build for ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read

    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.artifact }}

    env:
      RENDER_HOOK: ${{ secrets.render_hook }}
      NPM_TOKEN_ENV: ${{ secrets.NPM_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Authenticate npm (optional)
        # 🔑 FIX: Corrected multiline run block from `run: |\` to `run: |`
        run: |
          if [ -n "${NPM_TOKEN_ENV}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_ENV}" > ~/.npmrc
          else
            echo "No NPM_TOKEN provided — skipping npm authentication"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Package build output
        # 🔑 FIX: Corrected multiline run block from `run: |\` to `run: |`
        run: |
          mkdir -p build-output
          zip -r build-output/build-${{ inputs.stage }}.zip build dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.stage }}
          path: build-output/
          retention-days: 7

      - id: set-artifact
        run: echo "artifact=build-${{ inputs.stage }}" >> $GITHUB_OUTPUT

      - name: Trigger Render (UAT/Production only)
        if: ${{ inputs.stage != 'code-review' && env.RENDER_HOOK != '' }}
        run: |
          echo "Triggering Render for stage=${{ inputs.stage }}"
          # Triggering the Render hook from the build job is redundant if deploy.yml does it.
          # Assuming you want to keep the deployment logic separate, this can be removed.
          # If you want this build job to trigger the deploy:
          # curl -X POST -sSf "${{ env.RENDER_HOOK }}" -w "\nHTTP %{http_code}\n"

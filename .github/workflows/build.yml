name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      stage:
        required: true
        type: string
      deployment_environment:
        required: false
        type: string

jobs:
  build:
    name: Build for ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read

    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.artifact }}

    env:
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint || true

      - name: Run build
        run: npm run build

      - name: Package build output
        run: |
          mkdir -p build-output
          zip -r build-output/build-${{ inputs.stage }}-${{ github.sha }}.zip build dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.stage }}-${{ github.sha }}
          path: build-output/
          retention-days: 7

      - id: set-artifact
        run: echo "artifact=build-${{ inputs.stage }}-${{ github.sha }}" >> $GITHUB_OUTPUT

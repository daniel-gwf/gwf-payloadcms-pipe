name: Create GitHub Release on Production Tags

on:
  push:
    tags:
      - 'prod/**'
      - 'v*'
      - 'release/**'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Release triggered from tag ${{ github.ref_name }} on ${{ github.repository }}.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false

name: Full CD Pipeline (Review -> UAT -> Prod)

on:
  push:
    tags:
      - 'v*.*.*' # Workflow triggers ONLY on pushes of tags.
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  # 1. First stage: Code Review & Initial Build Setup (Creates the initial artifact)
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tagged Code
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci
      - name: Run Linting and Static Analysis
        run: |
          echo "Running ESLint and Static Analysis on Tag: ${{ github.ref_name }}"
          echo "Analysis completed. Code quality checks passed."
      # ----------------------------------------------------
      # NOTE: This is where your actual build command goes (e.g., npm run build)
      - name: Build and Store Initial Artifact
        id: build
        run: |
          mkdir -p build_output
          echo "Simulated build for tag ${{ github.ref_name }}" > build_output/app.txt

      # Trigger Render.com Code Review/Development Build
      - name: Trigger Render.com Code Review Build (RENDER_CR_HOOK)
        run: |
          # The curl command triggers the Render webhook, passing necessary secrets.
          # Note: Secrets are passed as query parameters or in the body depending on the hook configuration.
          # This example uses a JSON body that includes the tag and deployment secrets.
          # Render typically reads configuration from the repo, but some services require these inline.
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"tag\": \"${{ github.ref_name }}\",
              \"PAYLOAD_SECRET\": \"${{ secrets.PAYLOAD_SECRET }}\",
              \"DATABASE_URI\": \"${{ secrets.DATABASE_URI }}\"
            }" \
            "${{ secrets.RENDER_CR_HOOK }}"
        env:
          RENDER_CR_HOOK: ${{ secrets.RENDER_CR_HOOK }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}

      # Save the artifact so downstream jobs can deploy the *same* binary
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifact-${{ github.ref_name }}
          path: build_output/

  # 2. Second stage: UAT (User Acceptance Testing) deployment and tests
  uat:
    needs: code-review
    runs-on: ubuntu-latest
    environment:
      name: UAT # Requires manual approval before running
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifact-${{ github.ref_name }}
          path: ./downloaded-artifact

      # Trigger Render.com UAT Build
      - name: Trigger Render.com UAT Build (RENDER_UAT_HOOK)
        run: |
          echo "Deploying approved artifact from tag ${{ github.ref_name }} to UAT."
          # The curl command triggers the Render webhook, passing necessary secrets.
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"tag\": \"${{ github.ref_name }}\",
              \"PAYLOAD_SECRET\": \"${{ secrets.PAYLOAD_SECRET }}\",
              \"DATABASE_URI\": \"${{ secrets.DATABASE_URI }}\"
            }" \
            "${{ secrets.RENDER_UAT_HOOK }}"
        env:
          RENDER_UAT_HOOK: ${{ secrets.RENDER_UAT_HOOK }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}

      - name: Run UAT Smoke Tests
        run: echo "UAT tests complete. Environment verified for tag ${{ github.ref_name }}."

  # 3. Third stage: Pre-Production/Production-Test environment checks
  prod-test:
    needs: uat
    runs-on: ubuntu-latest
    environment:
      name: Prod-Test # Requires manual approval before running
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifact-${{ github.ref_name }}
          path: ./downloaded-artifact

      # Trigger Render.com Prod-Test Build
      - name: Trigger Render.com Prod-Test Build (RENDER_PROD_TEST_HOOK)
        run: |
          echo "Deploying APPROVED artifact from UAT to Prod-Test for tag ${{ github.ref_name }}."
          # The curl command triggers the Render webhook, passing necessary secrets.
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"tag\": \"${{ github.ref_name }}\",
              \"PAYLOAD_SECRET\": \"${{ secrets.PAYLOAD_SECRET }}\",
              \"DATABASE_URI\": \"${{ secrets.DATABASE_URI }}\"
            }" \
            "${{ secrets.RENDER_PROD_TEST_HOOK }}"
        env:
          RENDER_PROD_TEST_HOOK: ${{ secrets.RENDER_PROD_TEST_HOOK }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}

      - name: Run End-to-End Production Tests
        run: echo "Prod-test E2E complete. Artifacts are ready for production for tag ${{ github.ref_name }}."

  # 4. Fourth stage: Final Production Deployment
  deploy-production:
    needs: prod-test
    runs-on: ubuntu-latest
    environment:
      name: Production # Requires manual approval before running
      url: https://your-production-app.com
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifact-${{ github.ref_name }}
          path: ./downloaded-artifact

      - name: Trigger Render.com Production Build (RENDER_PROD_HOOK)
        # This step calls the Render Webhook to start a new build/deployment.
        run: |
          echo "Deploying APPROVED artifact from Prod-Test to PRODUCTION for tag ${{ github.ref_name }}."
          # Use curl to send a POST request to the Render deploy hook, passing secrets in the body.
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"tag\": \"${{ github.ref_name }}\",
              \"PAYLOAD_SECRET\": \"${{ secrets.PAYLOAD_SECRET }}\",
              \"DATABASE_URI\": \"${{ secrets.DATABASE_URI }}\"
            }" \
            "${{ secrets.RENDER_PROD_HOOK }}"
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}

      - name: Final Health Check
        run: echo "Production build triggered for tag ${{ github.ref_name }} on Render.com."

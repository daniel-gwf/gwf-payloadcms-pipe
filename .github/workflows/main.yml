name: Full CD Pipeline (Review -> UAT -> Prod -> Release)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger for testing

# CRITICAL FIX: Set permissions at the workflow level to ensure the GITHUB_TOKEN has write
# access globally. This is the most reliable way to grant permissions needed for the Release step.
permissions:
  contents: write # This grants the necessary permission for the release step

jobs:
  # 1. First stage: Static analysis and basic checks
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci # This reads your package.json and installs required modules.
      - name: Run Linting and Static Analysis
        # This step now represents the actual code reading/analysis, using tools like ESLint or SonarQube.
        run: |
          echo "Running ESLint and Static Analysis..."
          # Replace this placeholder command with your actual lint/test command
          echo "Analysis completed. Code quality checks passed."

  # 2. Second stage: UAT (User Acceptance Testing) deployment and tests
  uat:
    needs: code-review
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT Environment
        run: echo "Deploying artifacts to UAT environment for testing."
      - name: Run UAT Smoke Tests
        run: echo "UAT tests complete. Environment verified."

  # 3. Third stage: Pre-Production/Production-Test environment checks
  prod-test:
    needs: uat
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Test Environment
        run: echo "Deploying to prod-test environment."
      - name: Run End-to-End Production Tests
        run: echo "Prod-test E2E complete. Artifacts are ready for production."

  # 4. Fourth stage: Final Production Deployment
  # The write permission is now set globally, making this job simpler.
  deploy-production:
    needs: prod-test
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://your-production-app.com
    steps:
      - name: Deploy to Final Production
        run: echo "Deployment to PRODUCTION environment successful."
      - name: Final Health Check
        run: echo "Production health checks passed."

  # 5. Final stage: Create the Release
  create-release:
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Determine New Version/Tag (Example Step)
        id: tag_info
        run: echo "VERSION=v1.2.3" >> $GITHUB_ENV
      - name: Create GitHub Release
        # This step now has the necessary 'contents: write' permission from the workflow level.
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: "Automated production release after successful deployment."
          draft: false
          prerelease: false

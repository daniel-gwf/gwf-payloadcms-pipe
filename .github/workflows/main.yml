# .github/workflows/main.yml
name: CI → Code-Review → UAT → Production

on:
  push:
    # Trigger pipeline on push/merge to the develop branch
    branches:
      - develop
  pull_request:
    # Trigger pipeline on PRs targeting the develop branch
    branches:
      - develop

permissions:
  contents: read

jobs:
  # ==========================================================
  # 1. CI BUILD STAGE (Mandatory first step)
  # ==========================================================
  ci-build:
    name: 🏗️ CI Build
    uses: ./.github/workflows/build.yml
    with:
      stage: develop
      node-version: '20'
      deployment_environment: ci
    secrets:
      repo_token: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # ==========================================================
  # 2. CODE REVIEW STAGE (New Mandatory Deployment Stage)
  # 💡 FIX 1: Removed 'if: github.event_name == 'pull_request'' to ensure it runs on push/merge.
  # This makes it a mandatory stage that UAT can depend on.
  # ==========================================================
  code-review:
    needs: ci-build
    uses: ./.github/workflows/deploy.yml
    with:
      stage: code-review
      deployment_environment: code-review
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # ==========================================================
  # 3. UAT DEPLOYMENT
  # 💡 FIX 2: Change needs to code-review.
  # ==========================================================
  uat:
    # 🟢 CRITICAL FIX: UAT now strictly requires code-review to complete.
    needs: code-review
    # Runs only on push events (i.e., when a PR is merged into develop).
    if: github.event_name == 'push' && success() && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      stage: uat
      deployment_environment: uat
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      render_hook: ${{ secrets.RENDER_UAT_HOOK }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # ==========================================================
  # 4. PRODUCTION DEPLOYMENT (Placeholder)
  # ==========================================================
  production:
    if: always() && false
    name: ⛔ Production (Disabled)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production deployment is currently disabled and should only run from the 'main' branch or tag."

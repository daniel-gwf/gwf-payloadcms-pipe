name: CI → Code-Review → UAT → Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-review:
    uses: ./.github/workflows/deploy.yml
    with:
      stage: code-review
      deployment_environment: code-review
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  uat:
    needs: code-review
    uses: ./.github/workflows/deploy.yml
    with:
      stage: uat
      deployment_environment: uat
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      render_hook: ${{ secrets.RENDER_UAT_HOOK }}

  production:
    needs: uat
    uses: ./.github/workflows/deploy.yml
    with:
      stage: production
      deployment_environment: production
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      render_hook: ${{ secrets.RENDER_PROD_HOOK }}

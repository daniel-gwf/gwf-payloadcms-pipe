name: Full CD Pipeline (Review -> UAT -> Prod)

on:
  push:
    branches:
      - develop # Workflow will now trigger on pushes to the 'develop' branch
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  # 1. First stage: Code Review & Initial Build Setup
  # This job simulates the initial successful compilation and quality gate.
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci
      - name: Run Linting and Static Analysis
        run: |
          echo "Running ESLint and Static Analysis..."
          echo "Analysis completed. Code quality checks passed."

  # 2. Second stage: UAT (User Acceptance Testing) deployment and tests
  uat:
    needs: code-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build UAT Artifact
        run: echo "Building application artifact for UAT."
      - name: Deploy to UAT Environment
        run: echo "Deploying artifacts to UAT environment for testing."
      - name: Run UAT Smoke Tests
        run: echo "UAT tests complete. Environment verified."

  # 3. Third stage: Pre-Production/Production-Test environment checks
  prod-test:
    needs: uat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Prod-Test Artifact
        run: echo "Building application artifact for Prod-Test."
      - name: Deploy to Production Test Environment
        run: echo "Deploying to prod-test environment."
      - name: Run End-to-End Production Tests
        run: echo "Prod-test E2E complete. Artifacts are ready for production."

  # 4. Fourth stage: Final Production Deployment
  deploy-production:
    needs: prod-test
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://your-production-app.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Production Artifact
        run: echo "Building final production artifact."
      - name: Deploy to Final Production
        run: echo "Deployment to PRODUCTION environment successful."
      - name: Final Health Check
        run: echo "Production health checks passed."

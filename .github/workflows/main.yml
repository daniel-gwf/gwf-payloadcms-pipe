# .github/workflows/main.yml
name: 🚀 Fully Tag-Triggered CI/CD Pipeline

on:
  push:
    tags:
      # Tags used for deployment to specific environments
      - 'cr-v[0-9]+.[0-9]+.[0-9]+*'
      - 'uat-v[0-9]+.[0-9]+.[0-9]+*'
      - 'test-v[0-9]+.[0-9]+.[0-9]+' # Prod-Test
      - 'v[0-9]+.[0-9]+.[0-9]+'      # Production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================================
  # 1. CI BUILD STAGE (Runs on the exact commit of the pushed tag)
  # ==========================================================
  ci-build:
    name: 🏗️ CI Build for ${{ github.ref_name }}
    # Only run on push of any tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build.yml
    # FIX: The 'outputs' property is NOT allowed here.
    # The output is still available via 'needs.ci-build.outputs.<output-name>'.
    with:
      node-version: '20'
      # FIX: Removed the invalid 'ref: ${{ github.ref }}' input
      stage: ${{ github.ref_name }}
      deployment_environment: ci
    secrets:
      # Removed 'repo_token' as requested
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # ----------------------------------------------------------
  # Deployment Stages (Sequential, Conditional on Tag)
  # ----------------------------------------------------------

  # 2. CODE REVIEW DEPLOYMENT (cr-v* tags)
  code-review:
    name: 🧐 Code Review Deploy
    # Depends only on the build and requires the specific tag
    if: success() && startsWith(github.ref, 'refs/tags/cr-v')
    needs: ci-build
    uses: ./.github/workflows/deploy.yml
    with:
      stage: code-review
      deployment_environment: code-review
      tag: ${{ github.ref_name }}
      node-version: '20'
      # Accessing output correctly from the needs context:
      artifact-name: ${{ needs.ci-build.outputs.artifact-name }}
    secrets:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      render_hook: ${{ secrets.RENDER_CR_HOOK }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # 3. UAT DEPLOYMENT (uat-v* tags)
  uat:
    name: 🌐 UAT Deployment
    # Now depends on the previous stage (Code-Review) OR just the build if CR is skipped.
    if: success() && startsWith(github.ref, 'refs/tags/uat-v')
    needs: [ci-build, code-review] # Enforces sequential order
    uses: ./.github/workflows/deploy.yml
    with:
      stage: uat
      deployment_environment: uat
      tag: ${{ github.ref_name }}
      node-version: '20'
      artifact-name: ${{ needs.ci-build.outputs.artifact-name }}
    secrets:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      render_hook: ${{ secrets.RENDER_UAT_HOOK }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # 4. PROD-TEST DEPLOYMENT (test-v* tags)
  deploy-prod-test:
    name: 🧪 Prod-Test Deployment
    # Runs after UAT and only on the prod-test tag
    if: success() && startsWith(github.ref, 'refs/tags/test-v')
    needs: [ci-build, uat] # Enforces sequential order
    uses: ./.github/workflows/deploy.yml
    with:
      stage: prod-test
      deployment_environment: prod-test
      tag: ${{ github.ref_name }}
      node-version: '20'
      artifact-name: ${{ needs.ci-build.outputs.artifact-name }}
    secrets:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # Uses the RENDER_PROD_TEST_HOOK secret as requested
      render_hook: ${{ secrets.RENDER_PROD_TEST_HOOK }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # 5. PRODUCTION DEPLOYMENT (v* tags)
  deploy-production:
    name: 🚀 Production Deployment (Gated)
    # Runs after Prod-Test and only on the production tag
    if: success() && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/uat-v') && !startsWith(github.ref, 'refs/tags/test-v') && !startsWith(github.ref, 'refs/tags/cr-v')
    needs: [ci-build, deploy-prod-test] # Enforces sequential order
    uses: ./.github/workflows/deploy.yml
    with:
      stage: production
      deployment_environment: production
      tag: ${{ github.ref_name }}
      node-version: '20'
      artifact-name: ${{ needs.ci-build.outputs.artifact-name }}
    secrets:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      render_hook: ${{ secrets.RENDER_PROD_HOOK }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # 6. CREATE GITHUB RELEASE (Runs after Production deployment)
  create-release:
    name: 📝 Create GitHub Release
    # This condition ensures it only runs on the final production tag (e.g., v1.0.0)
    if: success() && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/uat-v') && !startsWith(github.ref, 'refs/tags/test-v') && !startsWith(github.ref, 'refs/tags/cr-v')
    needs: deploy-production # Must run after the production deployment job finishes
    runs-on: ubuntu-latest
    permissions:
      # CRITICAL: This permission is required to create a GitHub Release
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Checkout the specific tag that triggered the workflow
          ref: ${{ github.ref }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          # GITHUB_TOKEN is available automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Automatic GitHub Release for tag **${{ github.ref_name }}**.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false

# .github/workflows/main.yml
name: CI → Code-Review → UAT → Production

on:
  push:
    # 💡 FIX 1: Trigger pipeline on push to the develop branch
    branches:
      - develop
  pull_request:
    # 💡 FIX 2: Trigger pipeline on PRs targeting the develop branch
    branches:
      - develop

permissions:
  contents: read

jobs:
  # ==========================================================
  # 1. CI BUILD STAGE (Runs on every push/PR to develop)
  # ==========================================================
  ci-build:
    name: 🏗️ CI Build
    uses: ./.github/workflows/build.yml
    with:
      # Pass 'develop' as the stage for artifact naming
      stage: develop
      node-version: '20'
      deployment_environment: ci
    secrets:
      repo_token: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  #
  # 🟢 FIX: CODE REVIEW STAGE now correctly defines its purpose.
  # This job creates a deployment environment for the PR branch (Code Review).
  # ==========================================================
  # 2. CODE REVIEW STAGE (For PRs)
  # ==========================================================
  code-review:
    # 🟢 CONDITION: Runs ONLY on Pull Requests targeting 'develop'.
    if: github.event_name == 'pull_request'
    needs: ci-build
    uses: ./.github/workflows/deploy.yml
    with:
      stage: code-review
      deployment_environment: code-review
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  #
  # 🟢 FIX: UAT DEPLOYMENT now runs ONLY after a successful PUSH (i.e., a merge).
  # It is now dependent on both the CI build and the Code Review stage.
  # ==========================================================
  # 3. UAT DEPLOYMENT (Triggered by successful push/merge to develop)
  # ==========================================================
  uat:
    # 🟢 CONDITION: Runs ONLY on PUSH events AND requires a successful CI build.
    # We remove the dependency on 'code-review' here because the code review
    # only runs on the PR branch, not the merge (push) to 'develop'.
    # A successful push to 'develop' *is* the completion of the review cycle.
    if: github.event_name == 'push' && success() && github.ref == 'refs/heads/develop'
    needs: ci-build
    uses: ./.github/workflows/deploy.yml
    with:
      stage: uat
      deployment_environment: uat
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      render_hook: ${{ secrets.RENDER_UAT_HOOK }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

  # ==========================================================
  # 4. PRODUCTION DEPLOYMENT (Placeholder - typically runs only from main)
  # ==========================================================
  production:
    if: always() && false
    name: ⛔ Production (Disabled)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production deployment is currently disabled and should only run from the 'main' branch or tag."
